# Progetto generato da XcodeGen: dopo ogni modifica qui, `xcodegen generate`.
name: FocusTracker
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  bundleIdPrefix: com.paolocelestini
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 787YK9YUB3
    # Bump entrambi prima di ogni archive (CFBundleVersion = CURRENT_PROJECT_VERSION).
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 2026091601
targets:
  FocusTracker:
    type: application
    platform: iOS
    sources:
      - path: FocusTracker
        excludes: ["Info.plist"]
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paolocelestini.focustracker
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: FocusTracker/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "Focus Tracker"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: FocusTrackerWidgetExtension
  FocusTrackerWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: FocusTrackerWidget
        excludes: ["Info.plist"]
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paolocelestini.focustracker.widget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: FocusTrackerWidget/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "Focus Tracker"
        SKIP_INSTALL: YES
